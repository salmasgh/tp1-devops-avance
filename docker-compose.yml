services:
  k3s:
    image: rancher/k3s:v1.30.4-k3s1
    container_name: k3s
    privileged: true
    command: server --tls-san k3s --disable traefik
    tmpfs:
      - /run
      - /var/run
    environment:
      - K3S_KUBECONFIG_OUTPUT=/output/kubeconfig.yaml
      - K3S_KUBECONFIG_MODE=666
    volumes:
      - ./kubeconfig:/output
      - k3s-data:/var/lib/rancher/k3s

  toolbox:
    image: alpine/k8s:1.30.4
    container_name: toolbox
    entrypoint: ["sleep", "infinity"]
    working_dir: /work
    environment:
      - KUBECONFIG=/kube/kubeconfig.yaml
    volumes:
      - ./kubeconfig:/kube
      - ./work:/work
    ports:
      - "8080:8080"
    depends_on:
      - k3s

volumes:
  k3s-data:
